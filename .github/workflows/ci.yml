name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-formatting:
    name: Check Formatting
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macOS, labels: [self-hosted, macOS] }
          - { os: Windows, labels: [self-hosted, Windows] }
    runs-on: ${{ matrix.labels }}
    defaults:
      run:
        shell: bash
    steps:
      # Clone the repo with mirror-clone when available; fall back to
      # git clone otherwise (or if mirror-clone fails). A full clone is
      # required for the git-tag-derived version checks.
      - name: Clone Repo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
          if command -v mirror-clone >/dev/null 2>&1; then
            echo "using mirror-clone"
            mirror-clone --branch "$branch" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$GITHUB_WORKSPACE" || {
                echo "mirror-clone failed; falling back to git clone"
                rm -rf "$GITHUB_WORKSPACE"
                mkdir -p "$GITHUB_WORKSPACE"
                git clone --branch "$branch" \
                  "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                  "$GITHUB_WORKSPACE"
              }
          else
            echo "mirror-clone not installed; using git clone"
            git clone --branch "$branch" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$GITHUB_WORKSPACE"
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # goimports via `go install` (lands in $(go env GOPATH)/bin).
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.30.0

      # uv for the Python side (formattington via uv run). uv also
      # fetches CPython 3.14 on first use.
      - uses: astral-sh/setup-uv@v7

      # node + pnpm for the PATH-only formatter CLIs (prettier).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # prettier (pnpm) — matches the PATH-only requirement in format.bash.
      - name: Install pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install prettier
        shell: bash
        run: |
          set -euo pipefail
          PNPM_HOME="$HOME/pnpm"
          mkdir -p "$PNPM_HOME"
          pnpm config set global-bin-dir "$PNPM_HOME"
          pnpm add --global prettier
          echo "$PNPM_HOME" >> "$GITHUB_PATH"

      # shfmt — pinned release, installed into a scratch bin dir.
      - name: Install shfmt
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/fmt-bin"
          mkdir -p "$bin_dir"
          suffix=""
          case "$(uname -s)-$(uname -m)" in
            Darwin-x86_64)                 s=shfmt_v3.14.1_darwin_amd64 ;;
            Darwin-arm64)                  s=shfmt_v3.14.1_darwin_arm64 ;;
            Linux-x86_64)                  s=shfmt_v3.14.1_linux_amd64 ;;
            Linux-aarch64|Linux-arm64)     s=shfmt_v3.14.1_linux_arm64 ;;
            MINGW*-x86_64|MSYS*-x86_64|CYGWIN*-x86_64) s=shfmt_v3.14.1_windows_amd64.exe; suffix=.exe ;;
            MINGW*-aarch64|MSYS*-aarch64|CYGWIN*-aarch64|*arm64)   s=shfmt_v3.14.1_windows_amd64.exe; suffix=.exe ;;
            *) echo "unsupported platform: $(uname -s) $(uname -m)" >&2; exit 2 ;;
          esac
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v3.14.1/$s" -o "$bin_dir/shfmt$suffix"
          chmod +x "$bin_dir/shfmt$suffix"
          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          uv --version
          prettier --version
          shfmt --version
          goimports -h 2>&1 | head -1 || true

      # Requires uv, bash, prettier, shfmt, and goimports (all installed
      # above). Exits non-zero when anything is unformatted.
      - name: Run formattington format check
        run: ./ci/format_check.bash

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macOS, labels: [self-hosted, macOS] }
          - { os: Windows, labels: [self-hosted, Windows] }
    runs-on: ${{ matrix.labels }}
    defaults:
      run:
        shell: bash
    steps:
      # Clone the repo with mirror-clone when available; fall back to
      # git clone otherwise (or if mirror-clone fails). A full clone is
      # required for the git-tag-derived version checks.
      - name: Clone Repo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
          if command -v mirror-clone >/dev/null 2>&1; then
            echo "using mirror-clone"
            mirror-clone --branch "$branch" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$GITHUB_WORKSPACE" || {
                echo "mirror-clone failed; falling back to git clone"
                rm -rf "$GITHUB_WORKSPACE"
                mkdir -p "$GITHUB_WORKSPACE"
                git clone --branch "$branch" \
                  "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                  "$GITHUB_WORKSPACE"
              }
          else
            echo "mirror-clone not installed; using git clone"
            git clone --branch "$branch" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$GITHUB_WORKSPACE"
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go build ./...
